<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>フルスクリーン時計</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;   /* 通常：黒背景 */
      color: #fff;        /* 通常：白文字 */
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 0.3s, color 0.3s;
    }
    #clock {
      font-size: 35vw;
      line-height: 1;
      letter-spacing: 0.05em;
      text-align: center;
      white-space: nowrap;
      color: orange;   /* 通常：時計はオレンジ */
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="clock">テスト</div>

  <script>
    const clockEl = document.getElementById('clock');

    let noonEffectDone = false; // 今日の正午エフェクト用
    let hourEffectLock = false; // 毎時00分エフェクトの連続実行防止用

    function setNormalColors() {
      // 通常状態に戻す
      document.body.style.setProperty('background-color', '#000000', 'important');
      document.body.style.setProperty('color', '#ffffff', 'important');
      clockEl.style.setProperty('color', 'orange', 'important');
    }

    function setNoonWhite() {
      // 正午の真っ白状態
      document.body.style.setProperty('background-color', '#ffffff', 'important');
      document.body.style.setProperty('color', '#ffffff', 'important');
      clockEl.style.setProperty('color', '#ffffff', 'important');
    }

    function setHourOrangeBlack() {
      // 毎時00分のオレンジ背景＋黒文字状態
      document.body.style.setProperty('background-color', 'orange', 'important');
      document.body.style.setProperty('color', '#000000', 'important');
      clockEl.style.setProperty('color', '#000000', 'important');
    }

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');

      // 時計表示（分まで）
      clockEl.textContent = h + ':' + m;

      // 正午(12:00:00)の3秒真っ白エフェクト
      if (h === '12' && m === '00' && s === '00' && !noonEffectDone) {
        noonEffectDone = true;
        hourEffectLock = true; // この秒は毎時エフェクトを走らせない

        setNoonWhite();

        // 3秒後に元に戻す
        setTimeout(() => {
          setNormalColors();
        }, 3000);
      }

      // 正午以外の「毎時00分00秒」で1秒だけオレンジ背景＋黒文字
      if (m === '00' && s === '00' && h !== '12' && !hourEffectLock) {
        hourEffectLock = true;

        setHourOrangeBlack();

        // 1秒後に元の色へ
        setTimeout(() => {
          setNormalColors();
        }, 1000);
      }

      // 秒が00以外になったらロック解除（次の時間の00秒でまた動くように）
      if (s !== '00') {
        hourEffectLock = false;
      }

      // 日付が変わったら正午フラグをリセット（翌日も正午エフェクトを有効に）
      if (h === '00' && m === '00' && s === '00') {
        noonEffectDone = false;
      }
    }

    setInterval(updateClock, 1000);
    updateClock();
  

  // --- ここから 画面ロック防止 ---
  let wakeLock = null;

  async function requestWakeLock() {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => {
        console.log('Wake Lock released');
      });
      console.log('Wake Lock active');
    } catch (err) {
      console.warn('Wake Lock error:', err.name, err.message);
    }
  }

  async function releaseWakeLock() {
    try {
      if (wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
    } catch (e) {
      // ignore
    }
  }

  // ページが見える/隠れるたびに再取得を試みる
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if ('wakeLock' in navigator) requestWakeLock();
    } else {
      // 必要なら明示的に解放（任意）
      // releaseWakeLock();
    }
  });

  // 一部ブラウザはユーザー操作後でないと許可されないため保険で1回だけ試す
  ['click', 'keydown', 'touchstart'].forEach(evt => {
    document.addEventListener(evt, () => {
      if ('wakeLock' in navigator && !wakeLock) requestWakeLock();
    }, { once: true });
  });

  // 初期化時にも試す（ブロックされる場合は無害）
  window.addEventListener('load', () => {
    if ('wakeLock' in navigator) requestWakeLock();
    else console.warn('Screen Wake Lock API not supported on this browser.');
  });

  // 離脱時は解放（任意）
  window.addEventListener('beforeunload', releaseWakeLock);
  // --- ここまで 画面ロック防止 ---
　</script>
</body>
</html>
